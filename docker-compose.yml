version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: justicepal-postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=justicepal
    networks:
      - justicepal-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: justicepal-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://admin:password@postgres:5432/justicepal?schema=public
      - JWT_SECRET=supersecretkey_for_dev
    depends_on:
      - postgres
    networks:
      - justicepal-network
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev

  ai_service:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: justicepal-ai-service
    ports:
      - "8000:8000"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-dummy_key}
    networks:
      - justicepal-network
    volumes:
      - ./ai_service:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: justicepal-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    networks:
      - justicepal-network
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

volumes:
  postgres_data:

networks:
  justicepal-network:
    driver: bridge
