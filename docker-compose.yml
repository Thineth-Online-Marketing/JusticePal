version: '3.8'

services:
  mongodb:
    image: mongo:6-jammy
    container_name: justicepal-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
    networks:
      - justicepal-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: justicepal-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://admin:password@mongodb:27017/justicepal?authSource=admin
    depends_on:
      - mongodb
    networks:
      - justicepal-network
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev

  ai_service:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: justicepal-ai-service
    ports:
      - "8000:8000"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-dummy_key}
    networks:
      - justicepal-network
    volumes:
      - ./ai_service:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: justicepal-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    networks:
      - justicepal-network
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

volumes:
  mongodb_data:

networks:
  justicepal-network:
    driver: bridge
